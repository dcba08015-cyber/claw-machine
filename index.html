<title>娃娃機費用分攤</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

body{font-family:'Noto Sans TC','PingFang TC',sans-serif;background:var(--bg);color:var(--text);font-size:16px;}

/* ── PASSWORD SCREEN ── */
#pwd-screen{
  position:fixed;inset:0;
  background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%);
  display:flex;align-items:center;justify-content:center;
  padding:1.5rem;z-index:999;
}
.pwd-box{
  background:#fff;border-radius:20px;

.pwd-sub{color:var(--muted);font-size:0.88rem;margin-bottom:1.75rem;}
.pwd-input{
  width:100%;padding:0.9rem 1rem;

}

/* ── LOGIN SCREEN ── */
#login-screen{

/* ── APP SCREEN ── */

.logout-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:0.35rem 0.75rem;font-size:0.8rem;cursor:pointer;color:var(--muted);}

/* ── RECORD LIST ── */

/* ── LEDGER ── */
.ledger-wrap{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:0.5rem;}

/* ── MISC ── */

.retry-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:0.6rem 1.2rem;font-size:0.88rem;font-weight:600;cursor:pointer;margin-top:0.5rem;min-height:40px;}

/* ── TOAST ── */
#toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(100px);background:#1a1a18;color:#fff;padding:0.8rem 1.5rem;border-radius:40px;font-size:0.9rem;font-weight:500;transition:transform 0.3s;z-index:100;white-space:nowrap;max-width:85vw;text-align:center;}

/* ── LOADING ── */

/* ── DESKTOP RWD ── */
@media(min-width:600px){
  #login-screen{
    background:linear-gradient(135deg,#eff6ff 0%,#f5f4f0 100%);

  }
  .login-icon,.login-title,.login-sub{text-align:center;}
  #login-screen .login-inner{
    background:#fff;border-radius:20px;padding:3rem 2.5rem;

  .person-btn{padding:0.9rem;font-size:1rem;margin-bottom:0.75rem;border-radius:12px;}

  .btn{min-height:44px;padding:0.8rem;}
  .amt-big-value{font-size:2.5rem;}
  .topbar{padding:0.85rem 2rem;}
}
</style>

<body>
<div id="toast"></div>

<!-- ══ 密碼畫面 ══ -->
<div id="pwd-screen">
  <div class="pwd-box">
    <span class="pwd-icon">🔐</span>
    <div class="pwd-title">娃娃機費用分攤</div>
    <div class="pwd-sub">請輸入存取密碼</div>
    <input type="password" class="pwd-input" id="pwd-input" placeholder="密碼" maxlength="20">
    <button class="pwd-btn" onclick="checkPwd()">進入</button>
    <div class="pwd-error" id="pwd-error">密碼錯誤，請重試</div>
  </div>
</div>

<!-- ══ 登入畫面 ══ -->
<div id="login-screen">
  <div class="login-inner">
    <div class="login-icon">🎮</div>
    <div class="login-title">娃娃機費用分攤</div>
    <div class="login-sub">請選擇身分登入</div>
    <button class="person-btn owner" onclick="login(&#39;良偉&#39;)">👑 良偉（場主）</button>
    <button class="person-btn" onclick="login(&#39;伯父&#39;)">伯父</button>
    <button class="person-btn" onclick="login(&#39;聖承&#39;)">聖承</button>
  </div>
</div>

<!-- ══ APP 主畫面 ══ -->
<div id="app-screen">
  <div class="topbar">
    <div class="topbar-left">
      <div class="avatar" id="av">良</div>
      <div class="topbar-title">娃娃機費用</div>
    </div>
    <div style="display:flex;align-items:center;gap:0.5rem;">
      <span class="user-name" id="un"></span>
      <button class="logout-btn" onclick="logout()">登出</button>
    </div>
  </div>
  <div class="content">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab(&#39;list&#39;)">📋 紀錄</button>
      <button class="tab-btn" onclick="switchTab(&#39;new&#39;)" id="new-tab" style="display:none">＋ 新增</button>
    </div>
    <div id="tab-list">
      <div id="new-banner" style="display:none" onclick="switchTab(&#39;new&#39;)">
        <div class="new-banner">
          <div><div class="nb-title">＋ 記錄新月份費用</div><div class="nb-sub" id="banner-period">計算中...</div></div>
          <div style="font-size:2rem;margin-left:0.75rem;">📅</div>
        </div>
      </div>
      <div id="load-error" class="error-banner">載入失敗<br><button class="retry-btn" onclick="loadAll()">重新載入</button></div>
      <div id="records-list"></div>
      <div id="record-detail" style="display:none"></div>
    </div>
    <div id="tab-new" style="display:none">
      <div class="card">
        <div class="card-title">📅 新增月份費用</div>
        <div class="row1"><label>月份期間</label><input type="text" id="n-month" placeholder="例：2026年 4/22-5/21" style="font-weight:600;"></div>
        <div class="divider"></div>
        <div class="section-label">中清費用</div>
        <div class="row2">
          <div><label>店租</label><input type="number" id="n-rent" value="0" min="0" inputmode="numeric" oninput="updateTotal()"></div>
          <div><label>娛樂稅</label><input type="number" id="n-ent" value="0" min="0" inputmode="numeric" oninput="updateTotal()"></div>
        </div>
        <div class="row2">
          <div><label>營業稅</label><input type="number" id="n-biz" value="0" min="0" inputmode="numeric" oninput="updateTotal()"></div>
          <div><label>電費</label><input type="number" id="n-elec" value="0" min="0" inputmode="numeric" oninput="updateTotal()"></div>
        </div>
        <div class="row1"><label>其他(水費)</label><input type="number" id="n-other" value="0" min="0" inputmode="numeric" oninput="updateTotal()"></div>
        <div class="total-preview" id="total-preview">中清總計：<strong>$0</strong>｜各人分攤：<strong>$0</strong></div>
        <div class="divider"></div>
        <div class="section-label">益民租金（可調整）</div>
        <div class="row2">
          <div><label>伯父益民租金</label><input type="number" id="n-uncle" value="6500" min="0" inputmode="numeric"></div>
          <div><label>聖承益民租金</label><input type="number" id="n-sc" value="3500" min="0" inputmode="numeric"></div>
        </div>
        <div class="info-note">💡 良偉負擔 50%，伯父與聖承各負擔 25%，再加各自益民租金。</div>
        <button class="btn btn-primary" onclick="saveNewMonth()">💾 儲存並公開帳目</button>
      </div>
    </div>
  </div>

<script>
// ═══════════════════════════════════════
// ★ 設定區 — 只需修改這裡 ★
// ═══════════════════════════════════════
const PASSWORD = '9157';  // ← 在這裡設定密碼
const GAS_URL  = 'https://script.google.com/macros/s/AKfycbx6R5S4ay2LmpKoNNjwq8J8CB6_qeI5HT4C8v-xz9XT1DmJP1vxAND5rNlKxvFcLLGzAA/exec'; // ← Apps Script 部署網址
// ═══════════════════════════════════════

const YIMIN_DEFAULT = {伯父:6500, 聖承:3500};
let ME=null, RECORDS=[], SEL=null, NEXT=null;
const PRESETS=['野獸國','史迪奇','迪士尼','皮克斯','其他'];

// ── 密碼驗證 ──
function checkPwd(){
  const val = document.getElementById('pwd-input').value;
  const err = document.getElementById('pwd-error');
  if(val === PASSWORD){
    document.getElementById('pwd-screen').style.display='none';
    try{ localStorage.setItem('claw_auth','1'); }catch(e){}
    // 檢查是否有記憶登入
    try{
      const saved=localStorage.getItem('claw_user');
      if(saved&&['良偉','伯父','聖承'].includes(saved)){ ME=saved; applyLogin(saved); return; }
    }catch(e){}
    document.getElementById('login-screen').classList.add('active');
  } else {
    err.style.display='block';
    document.getElementById('pwd-input').value='';
    document.getElementById('pwd-input').focus();
  }
}
document.getElementById('pwd-input').addEventListener('keydown',e=>{ if(e.key==='Enter') checkPwd(); });

// ── 自動登入 ──
window.addEventListener('DOMContentLoaded',()=>{
  try{
    if(localStorage.getItem('claw_auth')==='1'){
      document.getElementById('pwd-screen').style.display='none';
      const saved=localStorage.getItem('claw_user');
      if(saved&&['良偉','伯父','聖承'].includes(saved)){ ME=saved; applyLogin(saved); return; }
      document.getElementById('login-screen').classList.add('active');
    }
  }catch(e){}
});

// ── 登入 ──
function login(p){
  ME=p;
  try{ localStorage.setItem('claw_user',p); }catch(e){}
  applyLogin(p);
}
function applyLogin(p){
  ME=p;
  document.getElementById('un').textContent=p;
  const av=document.getElementById('av');
  av.textContent=p[0];
  av.className='avatar'+(p==='良偉'?' owner-av':'');
  const isOwner=p==='良偉';
  document.getElementById('new-tab').style.display=isOwner?'':'none';
  document.getElementById('new-banner').style.display=isOwner?'':'none';
  document.getElementById('login-screen').classList.remove('active');
  document.getElementById('app-screen').classList.add('active');
  loadAll();
}
function logout(){
  ME=null; SEL=null;
  try{ localStorage.removeItem('claw_user'); }catch(e){}
  document.getElementById('app-screen').classList.remove('active');
  document.getElementById('login-screen').classList.add('active');
}

// ── API 呼叫（改用 fetch）──
async function callGAS(action, params={}){
  const url = new URL(GAS_URL);
  url.searchParams.set('action', action);
  Object.entries(params).forEach(([k,v])=> url.searchParams.set(k, typeof v==='object'?JSON.stringify(v):v));
  const res = await fetch(url.toString(), {redirect:'follow'});
  return await res.json();
}

// ── TABS ──
function switchTab(t){
  ['list','new'].forEach((id,i)=>{
    document.getElementById('tab-'+id).style.display=id===t?'':'none';
    document.querySelectorAll('.tabs .tab-btn')[i].classList.toggle('active',id===t);
  });
  if(t==='list'){ document.getElementById('record-detail').style.display='none'; renderList(); }
  if(t==='new'){
    const el=document.getElementById('n-month');
    if(!el.value){
      if(NEXT&&NEXT.suggestion) el.value=NEXT.suggestion;
      else callGAS('getNextPeriod').then(p=>{ NEXT=p; if(p&&p.success) el.value=p.suggestion||''; });
    }
  }
}

// ── LOAD ──
function loadAll(){
  showLoad(true);
  document.getElementById('load-error').style.display='none';
  Promise.all([callGAS('getAllRecords'), callGAS('getNextPeriod')])
    .then(([recs, period])=>{
      showLoad(false);
      if(!recs.success){ showLoadError(); return; }
      RECORDS=recs.data||[];
      NEXT=period;
      if(period&&period.success) document.getElementById('banner-period').textContent=period.suggestion;
      renderList();
    })
    .catch(()=>{ showLoad(false); showLoadError(); });
}
function showLoadError(){ document.getElementById('load-error').style.display='block'; document.getElementById('records-list').innerHTML=''; }

// ── CALC ──
function calcPay(r,person){
  const share=Math.round(r.租金總計/4);
  const yimin=person==='伯父'?r.伯父租金:r.聖承租金;
  const deducts=toArr(person==='伯父'?r.伯父扣抵:r.聖承扣抵);
  const extras=toArr(person==='伯父'?r.伯父額外:r.聖承額外);
  return share+yimin+deducts.reduce((s,d)=>s+Number(d.amount),0)+extras.reduce((s,d)=>s+Number(d.amount),0);
}
function toArr(v){ if(Array.isArray(v)) return v; if(typeof v==='string'){ try{ const p=JSON.parse(v); return Array.isArray(p)?p:[]; }catch(e){} } return []; }

// ── LIST ──
function renderList(){
  const el=document.getElementById('records-list');
  document.getElementById('record-detail').style.display='none';
  el.style.display='';
  if(!RECORDS.length){ el.innerHTML='<div class="empty">📭 尚無紀錄<br>請良偉先新增月份費用</div>'; return; }
  el.innerHTML=RECORDS.map(r=>{
    const uc=(r.伯父確認||'').includes('已確認'), sc=(r.聖承確認||'').includes('已確認');
    const upay=calcPay(r,'伯父'), spay=calcPay(r,'聖承');
    return `<div class="record-item" onclick="selectRecord('${r.月份}')">
      <div class="record-meta"><span class="record-month">${r.月份}</span><span class="record-total">中清 $${fmt(r.租金總計)}</span></div>
      <div class="record-pills">
        <span class="pill">良偉 $${fmt(Math.round(r.租金總計/2))}</span>
        <span class="pill ${uc?'ok':'wait'}">伯父 $${fmt(upay)}${uc?' ✓':''}</span>
        <span class="pill ${sc?'ok':'wait'}">聖承 $${fmt(spay)}${sc?' ✓':''}</span>
      </div>
      <div class="collect-row">應收合計（伯父＋聖承）：<strong>$${fmt(upay+spay)}</strong></div>
    </div>`;
  }).join('');
}

function toggleCustom(p){ document.getElementById('dc-'+p).style.display=document.getElementById('di-'+p).value==='__c__'?'':'none'; }
function addDeduct(person){
  const sel=document.getElementById('di-'+person).value;
  const item=sel==='__c__'?document.getElementById('dcv-'+person).value.trim():sel;
  if(!item){ toast('請填寫項目名稱',1); return; }
  const amtRaw=parseFloat(document.getElementById('da-'+person).value);
  if(!amtRaw||amtRaw<=0){ toast('請填寫正數金額',1); return; }
  const note=document.getElementById('dn-'+person).value.trim();
  showLoad(true);
  callGAS('addDeduction',{monthStr:SEL,person,item,amount:-Math.abs(amtRaw),note})
    .then(res=>{ showLoad(false); if(res.success){toast('已新增扣抵','ok');document.getElementById('da-'+person).value='';document.getElementById('dn-'+person).value='';document.getElementById('di-'+person).selectedIndex=0;document.getElementById('dc-'+person).style.display='none';reloadDetail();}else toast(res.error,1); })
    .catch(()=>{ showLoad(false); toast('連線失敗',1); });
}
function delDeduct(btn){
  const person=btn.dataset.person, idx=parseInt(btn.dataset.idx);
  if(!confirm('確定要刪除此扣抵項目？')) return;
  showLoad(true);
  callGAS('removeDeduction',{monthStr:SEL,person,index:idx})
    .then(res=>{ showLoad(false); if(res.success){toast('已刪除','ok');reloadDetail();}else toast(res.error,1); })
    .catch(()=>{ showLoad(false); toast('連線失敗',1); });
}

  if(!amt||amt<=0){ toast('請填寫正數金額',1); return; }
  const note=document.getElementById('extra-note').value.trim();
  showLoad(true);
  callGAS('addExtra',{monthStr:SEL,person,item,amount:amt,note})
    .then(res=>{ showLoad(false); if(res.success){toast('已新增額外費用','ok');document.getElementById('extra-item').value='';document.getElementById('extra-amt').value='';document.getElementById('extra-note').value='';reloadDetail();}else toast(res.error,1); })
    .catch(()=>{ showLoad(false); toast('連線失敗',1); });
}
function delExtra(btn){
  const person=btn.dataset.person, idx=parseInt(btn.dataset.eidx);
  if(!confirm('確定要刪除此額外費用？')) return;
  showLoad(true);
  callGAS('removeExtra',{monthStr:SEL,person,index:idx})
    .then(res=>{ showLoad(false); if(res.success){toast('已刪除','ok');reloadDetail();}else toast(res.error,1); })
    .catch(()=>{ showLoad(false); toast('連線失敗',1); });
}
function doConfirm(person){
  if(!confirm(`確定確認 ${SEL} 的應付金額？`)) return;
  showLoad(true);
  callGAS('confirmAmount',{monthStr:SEL,person})
    .then(res=>{ showLoad(false); if(res.success){toast('已確認！','ok');reloadDetail();}else toast(res.error,1); })
    .catch(()=>{ showLoad(false); toast('連線失敗',1); });
}
function doResetConfirm(person){
  if(!confirm(`確定解除${person}的確認？`)) return;
  showLoad(true);
  callGAS('resetConfirm',{monthStr:SEL,person})
    .then(res=>{ showLoad(false); if(res.success){toast(`已解除${person}確認`,'ok');reloadDetail();}else toast(res.error,1); })
    .catch(()=>{ showLoad(false); toast('連線失敗',1); });
}
function reloadDetail(){
  const m=SEL;
  callGAS('getAllRecords').then(res=>{ if(res.success){RECORDS=res.data; selectRecord(m);} });
}

// ── UTILS ──
function fmt(n){ return Number(n||0).toLocaleString(); }
function showLoad(v){ document.getElementById('loading').classList.toggle('show',v); }
let _tt;
function toast(msg,type){ const el=document.getElementById('toast'); el.textContent=msg; el.className='show'+(type==='ok'?' ok':type==='1'||type===1?' err':''); clearTimeout(_tt); _tt=setTimeout(()=>el.className='',3200); }
</script>
